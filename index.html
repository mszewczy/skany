    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/web/pdf_viewer.min.js"></script>
    <script>
        // BRAK storage access — bez Tracking Prevention blokady
        const pdfUrl = "https://pub-b8402fa0ed704c62ac446d52c2efacbb.r2.dev/legal/WZON-2026-MAREK_ALEX_S-0001.pdf";
        
        pdfjsLib.getDocument(pdfUrl).promise.then(pdf => {
            // Render PDF
            const viewer = new pdfjsViewer.PDFViewer({ container: document.getElementById('viewer') });
            viewer.pdfDocument = pdf;
        });
    </script>
