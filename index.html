<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>Archiwum PDF - Skany</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; }
        .header { 
            background: #222; 
            padding: 15px 20px; 
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h2 { font-size: 18px; }
        .header-info { text-align: right; font-size: 12px; line-height: 1.5; }
        .btn-translate { 
            background: #0070f3; 
            color: white; 
            border: none; 
            padding: 8px 15px; 
            border-radius: 4px; 
            cursor: pointer;
            margin-left: 10px;
        }
        .btn-translate:hover { background: #0051a2; }
        #pdfViewer { width: 100vw; height: calc(100vh - 50px); border: none; }
    </style>
</head>
<body>
    <div class="header">
        <h2>PDF Viewer - Skany</h2>
        <div class="header-info">
            <div>Language: <strong id="userLang">PL</strong> | PDF.js: <strong id="pdfVersion">MODERN</strong></div>
            <button class="btn-translate" onclick="translateDocument()">Translate</button>
        </div>
    </div>
    <iframe id="pdfViewer"></iframe>

    <script>
        const R2_URL = "https://pub-b8402fa0ed704c62ac446d52c2efacbb.r2.dev";
        const WORKER_URL = "https://pdf-translator.marek-bd6.workers.dev";
        const PDF_FILE = "legal/WZON-2026-MAREK_ALEX_S-0001.pdf";
        const GITHUB_RAW = "https://cdn.jsdelivr.net/gh/mszewczy/skany@main";
        
        function detectPDFVersion() {
            const hasWasm = typeof WebAssembly !== "undefined";
            const hasAsync = true;
            return (hasWasm && hasAsync) ? "modern" : "legacy";
        }

        const version = detectPDFVersion();
        document.getElementById("pdfVersion").innerText = version.toUpperCase();
        
        const pdfUrl = R2_URL + "/" + PDF_FILE;
        const viewerUrl = `${GITHUB_RAW}/web/pdf-${version}/web/viewer.html?file=${encodeURIComponent(pdfUrl)}`;
        
        console.log("PDF URL:", pdfUrl);
        console.log("Viewer URL:", viewerUrl);
        
        document.getElementById("pdfViewer").src = viewerUrl;

        const userLang = (navigator.language || navigator.userLanguage).split("-")[0].toUpperCase();
        document.getElementById("userLang").innerText = userLang;

        async function translateDocument() {
            const iframeDoc = document.getElementById("pdfViewer").contentDocument;
            if (!iframeDoc) {
                alert("PDF not loaded yet.");
                return;
            }

            const textLayers = iframeDoc.querySelectorAll(".textLayer span");
            if (textLayers.length === 0) {
                alert("No OCR text layer found in this document.");
                return;
            }

            const fullText = Array.from(textLayers).map(el => el.innerText).join(" ");
            const sampleText = fullText.substring(0, 500);

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        text: sampleText,
                        targetLang: userLang.toLowerCase(),
                        sourceLang: "pl"
                    })
                });

                const data = await response.json();
                if (data.translated_text) {
                    alert(`Translation:\n\n${data.translated_text}`);
                } else if (data.error) {
                    alert(`Error: ${data.error}`);
                } else {
                    alert("Translation service returned unexpected response.");
                }
            } catch (err) {
                console.error(err);
                alert("Translation service error: " + err.message);
            }
        }
    </script>
</body>
</html>
