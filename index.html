<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archiwum PDF - Skany</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #333; color: #fff; }
        #top-bar { 
            padding: 15px 20px; 
            background: #222; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid #444;
        }
        #top-bar strong { font-size: 18px; }
        #viewer-info { text-align: right; font-size: 12px; }
        #viewer-container { 
            width: 100vw; 
            height: calc(100vh - 50px); 
            border: none;
        }
        .btn-translate { 
            background: #0070f3; 
            color: white; 
            border: none; 
            padding: 8px 15px; 
            border-radius: 4px; 
            cursor: pointer;
            margin-left: 10px;
        }
        .btn-translate:hover { background: #0051a2; }
    </style>
</head>
<body>

<div id="top-bar">
    <div><strong>📄 Archiwum PDF</strong></div>
    <div id="viewer-info">
        Język: <span id="user-lang">PL</span>
        <button class="btn-translate" onclick="translateDocument()">Tłumacz</button>
    </div>
</div>

<iframe id="viewer-container" src=""></iframe>

<script>
    // Detekcja wersji PDF.js
    function detectPDFVersion() {
        const capabilities = {
            hasModules: false,
            hasAsync: false,
            hasWasm: false
        };
        
        try {
            new Function('import("").catch(()=>0)');
            capabilities.hasModules = true;
        } catch (e) {}
        
        try {
            eval('(async () => {})');
            capabilities.hasAsync = true;
        } catch (e) {}
        
        capabilities.hasWasm = typeof WebAssembly !== 'undefined';
        
        return (capabilities.hasModules && capabilities.hasAsync && capabilities.hasWasm) 
            ? 'modern' : 'legacy';
    }

    // Parametry URL
    const urlParams = new URLSearchParams(window.location.search);
    const pdfFile = urlParams.get('file') || 'sample.pdf';
    const version = detectPDFVersion();
    const pdfPath = `/web/pdf-${version}/web/viewer.html?file=${encodeURIComponent(pdfFile)}`;

    // Ładowanie
    document.getElementById('viewer-container').src = pdfPath;

    // Detekcja języka
    const userLang = (navigator.language || navigator.userLanguage).split('-')[0].toUpperCase();
    document.getElementById('user-lang').innerText = userLang;

    // Funkcja tłumaczenia (stub)
    async function translateDocument() {
        alert(`Tłumaczenie dla języka: ${userLang} (funkcja w przygotowaniu)`);
    }
</script>

</body>
</html>
