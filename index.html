<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer - Skany</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            background: #222;
            padding: 15px 20px;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }
        .browser-info {
            font-size: 12px;
            color: #888;
            text-align: right;
        }
        .viewer-container {
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 PDF Viewer</h1>
            <div class="browser-info">
                <div id="versionInfo"></div>
            </div>
        </div>
        <div class="viewer-container">
            <div class="loading" id="loading">Ładowanie przeglądarki PDF...</div>
            <iframe id="pdfViewer" src="" style="display:none;"></iframe>
        </div>
    </div>

    <script>
        // Konfiguracja ścieżek PDF.js
        const PDF_PATHS = {
            modern: '/web/pdf-modern/web/viewer.html',
            legacy: '/web/pdf-legacy/web/viewer.html'
        };

        // Detekcja możliwości przeglądarki
        function detectBrowserCapabilities() {
            const capabilities = {
                hasModuleSupport: false,
                hasAsyncAwait: false,
                hasWebAssembly: false,
                hasWorkers: false,
                browserName: 'Unknown',
                version: 'Unknown'
            };

            // Test ES6 Module support
            try {
                new Function('import("").catch(()=>0)');
                capabilities.hasModuleSupport = true;
            } catch (e) {
                capabilities.hasModuleSupport = false;
            }

            // Test async/await
            try {
                eval('(async () => {})');
                capabilities.hasAsyncAwait = true;
            } catch (e) {
                capabilities.hasAsyncAwait = false;
            }

            // Test WebAssembly
            capabilities.hasWebAssembly = typeof WebAssembly !== 'undefined';

            // Test Web Workers
            capabilities.hasWorkers = typeof Worker !== 'undefined';

            // Browser detection
            const ua = navigator.userAgent;
            if (ua.indexOf('Firefox') > -1) {
                capabilities.browserName = 'Firefox';
                const match = ua.match(/Firefox\/(\d+)/);
                capabilities.version = match ? match[1] : 'Unknown';
            } else if (ua.indexOf('Chrome') > -1) {
                capabilities.browserName = 'Chrome';
                const match = ua.match(/Chrome\/(\d+)/);
                capabilities.version = match ? match[1] : 'Unknown';
            } else if (ua.indexOf('Safari') > -1) {
                capabilities.browserName = 'Safari';
                const match = ua.match(/Version\/(\d+)/);
                capabilities.version = match ? match[1] : 'Unknown';
            } else if (ua.indexOf('Edge') > -1) {
                capabilities.browserName = 'Edge';
                const match = ua.match(/Edge\/(\d+)/);
                capabilities.version = match ? match[1] : 'Unknown';
            }

            return capabilities;
        }

        // Wybór wersji PDF.js
        function selectPDFVersion(capabilities) {
            // Kryteria dla wersji nowoczesnej (modern)
            const useModern =
                capabilities.hasModuleSupport &&
                capabilities.hasAsyncAwait &&
                capabilities.hasWebAssembly &&
                capabilities.hasWorkers;

            return useModern ? 'modern' : 'legacy';
        }

        // Główna inicjalizacja
        function initPDFViewer() {
            const capabilities = detectBrowserCapabilities();
            const version = selectPDFVersion(capabilities);
            const viewerPath = PDF_PATHS[version];

            // Wyświetl informacje o przeglądarce
            const versionInfo = document.getElementById('versionInfo');
            versionInfo.innerHTML = `
                <strong>${capabilities.browserName} ${capabilities.version}</strong><br>
                Wersja PDF.js: <strong>${version.toUpperCase()}</strong><br>
                <small>Moduły ES6: ${capabilities.hasModuleSupport ? '✓' : '✗'} |
                Async/Await: ${capabilities.hasAsyncAwait ? '✓' : '✗'} |
                WASM: ${capabilities.hasWebAssembly ? '✓' : '✗'}</small>
            `;

            // Załaduj viewer
            const iframe = document.getElementById('pdfViewer');
            iframe.src = viewerPath;
            iframe.onload = function() {
                document.getElementById('loading').style.display = 'none';
                iframe.style.display = 'block';
            };
        }

        // Start gdy DOM jest gotowy
        document.addEventListener('DOMContentLoaded', initPDFViewer);
    </script>
</body>
</html>
